<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Pulse plugin icon</title>
  <desc id="desc">RSS signal arcs with a heartbeat pulse line for the Pulse Limnoria plugin.</desc>
  <defs>
